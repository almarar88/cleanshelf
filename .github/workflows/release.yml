name: Release

# ينشر إصدارًا بملفات ويندوز وماك وأندرويد. يُشغَّل بدفع وسم مثل v1.0.0،
# أو يدويًا من تبويب Actions مع تحديد اسم الوسم.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'اسم الوسم للإصدار (مثال: v1.1.0)'
        required: true
        default: v1.7.0

permissions:
  contents: write

jobs:
  # يبني كل منصة على نظامها ويرفع الناتج كـ artifact مؤقت
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build: npm run build:win
            artifacts: dist/*.exe
          - os: macos-latest
            platform: mac
            build: npm run build:mac
            artifacts: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: ${{ matrix.build }}

      # لا نَنشر تطبيقًا لم نتأكد أنه يُقلع على نظامه
      - name: Smoke-test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CLEANSHELF_SMOKE_TEST: '1'
        run: |
          $exe = "dist/win-unpacked/CleanShelf.exe"
          if (-not (Test-Path $exe)) { throw "لم يُعثر على الملف المبني: $exe" }
          $env:CLEANSHELF_SMOKE_LOG = Join-Path $PWD "smoke-log.txt"
          $proc = Start-Process -FilePath $exe -PassThru -NoNewWindow
          $null = $proc.Handle
          if (-not $proc.WaitForExit(300000)) { $proc.Kill(); throw "لم ينتهِ خلال 300 ثانية" }
          if (Test-Path $env:CLEANSHELF_SMOKE_LOG) { Get-Content $env:CLEANSHELF_SMOKE_LOG }
          if ($proc.ExitCode -ne 0) { throw "فشل فحص التشغيل برمز $($proc.ExitCode)" }

      - name: Smoke-test (macOS)
        if: matrix.platform == 'mac'
        env:
          CLEANSHELF_SMOKE_TEST: '1'
          CLEANSHELF_SMOKE_LOG: smoke-log.txt
        run: |
          APP="dist/mac-universal/CleanShelf.app/Contents/MacOS/CleanShelf"
          if [ ! -f "$APP" ]; then APP="dist/mac/CleanShelf.app/Contents/MacOS/CleanShelf"; fi
          if [ ! -f "$APP" ]; then echo "لم يُعثر على التطبيق المبني:"; ls -R dist | head -40; exit 1; fi
          "$APP" & APP_PID=$!
          ( sleep 300 && kill -9 $APP_PID 2>/dev/null ) & WATCHDOG=$!
          set +e
          wait $APP_PID
          CODE=$?
          set -e
          kill -9 $WATCHDOG 2>/dev/null || true
          [ -f smoke-log.txt ] && cat smoke-log.txt
          if [ $CODE -ne 0 ]; then echo "فشل فحص التشغيل برمز $CODE"; exit 1; fi

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # يبني APK أندرويد ثم يشغّله فعليًا على محاكي: يثبّت، يمنح إذن الملفات، يفتح
  # التطبيق، وينتظر سطرَي CLEANSHELF_SMOKE_OK (الواجهة + الجسر) و
  # CLEANSHELF_SMOKE_SCAN (فحص فعلي للذاكرة عبر الكود الأصلي) في logcat.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Type-check and build web bundle
        working-directory: mobile
        run: npm run build

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build signed APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke-test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # كل سطر في script يُنفَّذ بصدفة مستقلة، فالحلقات لا تعمل هنا — السكربت في ملف
          script: bash mobile/android-smoke.sh

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-screenshot
          path: android-smoke.png
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: mobile/android/app/build/outputs/apk/release/CleanShelf.apk
          if-no-files-found: error

  # ينشر بعد نجاح المنصات الثلاث معًا، فلا يخرج إصدار ناقص
  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          ls -la release-files
          FILES=$(find release-files -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.apk' \))
          if [ -z "$FILES" ]; then echo "لا توجد ملفات للنشر"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # إعادة تشغيل على وسم منشور: نحدّث العنوان والملاحظات ونستبدل الملفات
            gh release edit "$TAG" \
              --title "CleanShelf $TAG" \
              --notes-file .github/release-notes.md
            gh release upload "$TAG" $FILES --clobber
            echo "تم تحديث الإصدار $TAG"
          else
            gh release create "$TAG" $FILES \
              --target "$GITHUB_SHA" \
              --title "CleanShelf $TAG" \
              --notes-file .github/release-notes.md
            echo "تم نشر الإصدار $TAG"
          fi
