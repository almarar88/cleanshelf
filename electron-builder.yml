appId: com.alcode.cleanshelf
copyright: © 2026 Alcode
productName: CleanShelf
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# أيقونات شريط النظام تُقرأ من resources/tray وقت التشغيل
extraResources:
  - from: build/tray
    to: tray
win:
  icon: build/icon.ico
  publisherName: Alcode
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: '${productName}-${arch}.${ext}'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # بلا رقم إصدار في الاسم، ليبقى رابط /releases/latest/download ثابتًا عبر الإصدارات
  artifactName: '${productName}-Setup.${ext}'
portable:
  artifactName: '${productName}-Portable.${ext}'
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  target:
    # نسخة universal واحدة تعمل على Apple Silicon و Intel معًا،
    # فيبقى للمستخدم رابط تحميل واحد لا خياران يربكانه
    - target: dmg
      arch: [universal]
  artifactName: '${productName}.${ext}'
  # التطبيق غير موقَّع، فتعطيل hardened runtime يتجنّب فشلًا مؤكدًا عند البناء
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  artifactName: '${productName}.${ext}'
